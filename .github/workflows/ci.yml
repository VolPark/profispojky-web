name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint · typecheck · testy · audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalace
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: TypeScript
        run: pnpm typecheck

      - name: Unit testy
        run: pnpm test

      # Build se tady nespouští – potřebuje DB (ISR předgeneruje stránky). Ověřuje ho Vercel preview deploy každého PR.
      - name: Audit závislostí (blokuje jen high/critical v produkčních balíčcích)
        run: pnpm audit --prod --audit-level=high --ignore-unfixable
