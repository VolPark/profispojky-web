# Lokální Postgres pro vývoj. Major verze odpovídá cílové platformě (Supabase = Postgres 17).
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: payload
      POSTGRES_PASSWORD: payload
      POSTGRES_DB: profispojky
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U payload -d profispojky']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
